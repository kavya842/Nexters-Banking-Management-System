<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
<div th:replace="~{admin/layout :: nav}"></div>

<h1>Admin Dashboard</h1>

<div class="cards">
    <div class="card"><h3>Customers</h3><p th:text="${stats.totalCustomers}">0</p></div>
    <div class="card"><h3>Total Accounts</h3><p th:text="${stats.totalAccounts}">0</p></div>
    <div class="card"><h3>Active</h3><p th:text="${stats.activeAccounts}">0</p></div>
    <div class="card"><h3>Frozen</h3><p th:text="${stats.frozenAccounts}">0</p></div>
    <div class="card"><h3>Closed</h3><p th:text="${stats.closedAccounts}">0</p></div>
    <div class="card">
        <h3>Total Balance</h3>
        <p th:text="${#numbers.formatDecimal(stats.totalBalance, 1, 'COMMA', 2, 'POINT')}">0.00</p>
    </div>
</div>
</body>
</html>
